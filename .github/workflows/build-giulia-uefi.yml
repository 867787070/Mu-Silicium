name: Build giulia UEFI

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git mono-devel build-essential lld uuid-dev nasm \
            gcc-aarch64-linux-gnu python3 python3-pip python3-venv \
            gettext locales gnupg ca-certificates clang llvm curl

      - name: Install Python requirements
        run: |
          python3 -m pip install --upgrade pip
          pip install -r pip-requirements.txt

      - name: Build giulia UEFI
        run: |
          python3 build_uefi.py -d giulia -r RELEASE -c

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: giulia-uefi
          path: |
            Mu-giulia*.img
            BootShim/BootShim.bin
